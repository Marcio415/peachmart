<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Peachmart</title>
<style>
  :root{
    --bg:#FFF3EE; --paper:#FFFFFF; --ink:#3D2430; --ink-soft:#8C6672; --line:#F5DED2;
    --primary:#E8447B; --primary-dark:#B22F5E; --peach:#FF9A6C; --pink:#E8447B; --gold:#F2A65A; --danger:#C0392B;
    --dinheiro:#4C7A3A; --cartao:#3A5BA6; --pix:#00958D;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
  button{font-family:inherit;cursor:pointer;}
  input{font-family:inherit;}
  .app{min-height:100vh;}
  .header{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);}
  .header-inner{max-width:1100px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:8px;}
  .brand-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg, var(--peach), var(--pink));display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
  .brand-icon img{width:100%;height:100%;object-fit:cover;display:block;}
  .logo-lg{width:64px;height:64px;border-radius:16px;overflow:hidden;margin:0 auto 16px;box-shadow:0 6px 18px rgba(232,68,123,.25);}
  .logo-lg img{width:100%;height:100%;object-fit:cover;display:block;}
  .brand h1{font-size:17px;font-weight:600;margin:0;line-height:1;}
  .brand button.name-btn{background:none;border:none;display:flex;align-items:center;gap:6px;padding:0;color:var(--ink);}
  .name-input{font-size:17px;font-weight:600;background:transparent;border:none;border-bottom:1px solid var(--line);outline:none;padding:2px 2px;color:var(--ink);}
  .badge{font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;margin-left:2px;}
  .badge.caixa{background:var(--primary);color:#fff;}
  .badge.financeiro{background:var(--gold);color:var(--ink);}
  .btn{border-radius:10px;padding:8px 14px;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px;}
  .btn-primary{background:var(--primary);color:#fff;border-color:var(--primary);}
  .btn-primary:disabled{background:var(--line);border-color:var(--line);cursor:not-allowed;}
  .nav{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px;gap:2px;}
  .nav button{background:none;border:none;padding:7px 12px;border-radius:7px;font-size:13px;font-weight:500;color:var(--ink-soft);display:flex;align-items:center;gap:6px;}
  .nav button.active{background:var(--primary);color:#fff;}
  .menu-btn{background:var(--bg);border:1px solid var(--line);border-radius:10px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);padding:0;}
  .menu-bar{max-width:1100px;margin:0 auto;padding:10px 20px 14px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;}
  .menu-bar button{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 13px;font-size:13px;font-weight:500;color:var(--ink-soft);display:flex;align-items:center;gap:6px;}
  .menu-bar button.active{background:var(--primary);color:#fff;border-color:var(--primary);}
  main{max-width:1100px;margin:0 auto;padding:22px 20px 60px;}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;}
  .grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:22px;}
  .col3{grid-column:span 3;}
  .col2{grid-column:span 2;}
  @media(max-width:860px){.grid5{grid-template-columns:1fr;}.col3,.col2{grid-column:span 1;}}
  .stack{display:flex;flex-direction:column;gap:16px;}
  label.field-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);display:block;margin-bottom:6px;}
  .input-wrap{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;display:flex;align-items:center;gap:8px;}
  .input-wrap input{border:none;background:transparent;outline:none;font-size:14px;flex:1;color:var(--ink);width:100%;}
  .field{margin-bottom:12px;}
  .row{display:flex;gap:12px;}
  .row > *{flex:1;}
  .empty{padding:26px 10px;text-align:center;font-size:13px;color:var(--ink-soft);}
  .error-text{color:var(--danger);font-size:12px;margin-top:6px;}
  .flash{margin-top:6px;font-size:13px;display:flex;align-items:center;gap:6px;}
 
  /* Caixa */
  .catalog-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  @media(max-width:640px){.catalog-grid{grid-template-columns:repeat(2,1fr);}}
  .prod-btn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;text-align:left;}
  .prod-btn:disabled{opacity:.4;cursor:not-allowed;}
  .prod-btn .pname{font-size:12px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .prod-btn .pprice{font-size:12px;margin-top:4px;color:var(--primary-dark);}
  .prod-btn .pstock{font-size:10.5px;margin-top:2px;}
  .cart-item{display:flex;align-items:center;justify-content:space-between;padding:9px 0;gap:8px;}
  .cart-item .ci-name{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cart-item .ci-unit{font-size:11.5px;color:var(--ink-soft);}
  .qty-btn{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:var(--paper);display:inline-flex;align-items:center;justify-content:center;}
  .dashed{border-top:1px dashed var(--line);}
  .cart-total{display:flex;align-items:center;justify-content:space-between;padding-top:12px;margin-top:6px;border-top:1px dashed var(--line);}
  .cart-total .val{font-size:21px;font-weight:700;color:var(--primary-dark);}
  .pay-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;}
  .pay-btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--ink);}
  .pay-btn.active{color:#fff;}
  .pix-box,.cash-box{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px;margin-top:10px;}
  .pix-box img{border-radius:8px;}
  .finalize-btn{width:100%;color:#fff;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:700;margin-top:10px;}
  .success-banner{background:var(--primary);color:#fff;border-radius:10px;padding:11px 12px;margin-top:12px;font-size:13px;display:flex;align-items:center;gap:8px;}
 
  /* Relatório */
  .stat-card{border-radius:14px;padding:16px;}
  .stat-card .lbl{font-size:11px;font-weight:600;text-transform:uppercase;opacity:.85;}
  .stat-card .val{font-size:23px;font-weight:700;margin-top:4px;}
  .stat-card .sub{font-size:12px;margin-top:4px;opacity:.75;}
  .bars{display:flex;align-items:flex-end;gap:10px;height:130px;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;}
  .bar{width:100%;border-radius:6px 6px 0 0;min-height:4px;}
  .sale-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);gap:10px;}
  .sale-row:first-child{border-top:none;}
  .pay-chip{font-size:11px;font-weight:600;border-radius:99px;padding:3px 8px;display:inline-flex;align-items:center;gap:4px;}
 
  /* Produtos */
  .prod-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);gap:12px;}
  .prod-row:first-child{border-top:none;}
  .icon-btn{background:none;border:none;padding:2px;display:inline-flex;}
 
  /* Pin gate */
  .pin-wrap{max-width:360px;margin:32px auto 0;text-align:center;}
  .pin-circle{width:44px;height:44px;border-radius:99px;background:var(--bg);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;}
  .pin-input{width:100%;text-align:center;letter-spacing:.5em;font-size:18px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px;outline:none;margin-bottom:8px;}
 
  /* Situação / Fechamento de caixa */
  .kv-row{display:flex;justify-content:space-between;font-size:13px;padding:2px 0;}
  .kv-row.total{font-weight:700;border-top:1px dashed var(--line);padding-top:8px;margin-top:4px;}
 
  @media print {
    body *{visibility:hidden;}
    #print-area, #print-area *{visibility:visible;}
    #print-area{position:absolute;left:0;top:0;width:100%;padding:0;border:none;}
    .no-print{display:none !important;}
  }
</style>
</head>

const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2));
const brl = (n) => (Number(n) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const todayStr = () => new Date().toDateString();
const stripAccents = (s) => (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const escapeHtml = (str) => String(str ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
 
// ---------------------------------------------------------------------------
// Payload Pix (BR Code / EMV) — mesmo formato dos QR Codes oficiais de
// cobrança Pix, com CRC16 exigido pelo padrão do Banco Central.
// ---------------------------------------------------------------------------
function emv(id, value) {
  const len = String(value.length).padStart(2, '0');
  return `${id}${len}${value}`;
}
function crc16(payload) {
  let crc = 0xffff;
  const poly = 0x1021;
  for (let i = 0; i < payload.length; i++) {
    crc ^= payload.charCodeAt(i) << 8;
    for (let j = 0; j < 8; j++) crc = (crc & 0x8000) !== 0 ? ((crc << 1) ^ poly) & 0xffff : (crc << 1) & 0xffff;
  }
  return crc.toString(16).toUpperCase().padStart(4, '0');
}
function buildPixPayload({ key, name, city, amount }) {
  const merchantName = (stripAccents(name || 'RECEBEDOR').toUpperCase().slice(0, 25)) || 'RECEBEDOR';
  const merchantCity = (stripAccents(city || 'BRASIL').toUpperCase().slice(0, 15)) || 'BRASIL';
  const merchantInfo = emv('00', 'br.gov.bcb.pix') + emv('01', key.trim());
  let payload =
    emv('00', '01') + emv('01', '12') + emv('26', merchantInfo) + emv('52', '0000') + emv('53', '986') +
    (amount > 0 ? emv('54', Number(amount).toFixed(2)) : '') + emv('58', 'BR') + emv('59', merchantName) +
    emv('60', merchantCity) + emv('62', emv('05', '***'));
  payload += '6304';
  return payload + crc16(payload);
}

const hasClaudeStorage = typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function';
async function storageGet(key) {
  if (hasClaudeStorage) {
    try { return await window.storage.get(key, false); } catch (e) { return null; }
  }
  try {
    const raw = localStorage.getItem('peachmart_' + key);
    return raw !== null ? { value: raw } : null;
  } catch (e) { return null; }
}
function storageSet(key, value) {
  if (hasClaudeStorage) {
    try { window.storage.set(key, value, false).catch(() => {}); } catch (e) {}
    return;
  }
  try { localStorage.setItem('peachmart_' + key, value); } catch (e) {}
}
 
function render() {
  const active = document.activeElement;
  let focusId = null, selStart = null, selEnd = null;
  if (active && active.id) {
    focusId = active.id;
    if (typeof active.selectionStart === 'number') { selStart = active.selectionStart; selEnd = active.selectionEnd; }
  }
  root.innerHTML = buildHTML();
  if (focusId) {
    const el = document.getElementById(focusId);
    if (el) {
      el.focus();
      if (selStart != null && el.setSelectionRange) { try { el.setSelectionRange(selStart, selEnd); } catch (e) {} }
    }
  }
}

function computeTotal() { return state.cart.reduce((s, i) => s + i.price * i.qty, 0); }
 
function addByBarcode(raw) {
  let input = (raw || '').trim();
  if (!input) return;
  let qty = 1;
  if (input.includes('*')) {
    const [qtyPart, ...rest] = input.split('*');
    const parsedQty = parseInt(qtyPart.trim(), 10);
    const barcodePart = rest.join('*').trim();
    if (parsedQty > 0 && barcodePart) { qty = parsedQty; input = barcodePart; }
  }
  const barcode = input.trim();
  const product = state.products.find((p) => p.barcode === barcode);
  if (!product) { state.notFound = barcode; state.code = ''; render(); focusById('barcode-input'); return; }
  state.notFound = '';
  addToCart(product, qty);
  state.code = '';
  render();
  focusById('barcode-input');
}
function addToCart(product, qtyToAdd = 1) {
  if (!product) return;
  const existing = state.cart.find((i) => i.barcode === product.barcode);
  const currentQty = existing ? existing.qty : 0;
  const newQty = Math.min(product.stock, currentQty + qtyToAdd);
  if (newQty <= currentQty) return;
  if (existing) existing.qty = newQty;
  else state.cart.push({ barcode: product.barcode, name: product.name, price: product.price, qty: newQty });
}
function changeQty(barcode, delta) {
  const item = state.cart.find((i) => i.barcode === barcode);
  if (!item) return;
  const product = state.products.find((p) => p.barcode === barcode);
  const stock = product ? product.stock : 999;
  item.qty = Math.min(stock, Math.max(1, item.qty + delta));
}
function removeItem(barcode) { state.cart = state.cart.filter((i) => i.barcode !== barcode); }
 
function computeCanFinalize() {
  const total = computeTotal();
  if (state.cart.length === 0 || !state.payment) return false;
  if (state.payment === 'dinheiro') {
    const receivedNum = parseFloat((state.receivedStr || '0').replace(',', '.'));
    return receivedNum > 0 && receivedNum >= total;
  }
  if (state.payment === 'pix') return !!(state.pixConfig && state.pixConfig.key);
  return true;
}
async function finalizeSale() {
  if (!computeCanFinalize()) return;
  const total = computeTotal();
  const receivedNum = state.payment === 'dinheiro' ? parseFloat((state.receivedStr || '0').replace(',', '.')) : undefined;
  const troco = state.payment === 'dinheiro' ? receivedNum - total : undefined;
  const sale = { id: uid(), datetime: new Date().toISOString(), items: state.cart.map((i) => ({ ...i })), total, payment: state.payment, received: receivedNum, troco, operator: state.currentUser?.name || null };
  const { error } = await supabaseClient
  .from('vendas')
  .insert([sale]);

if (error) {
  console.error('Erro ao salvar venda:', error);
  alert('Erro ao salvar venda no Supabase: ' + error.message);
  return;
}

state.sales = [sale, ...state.sales];
  const next = state.products.map((p) => {
    const item = state.cart.find((i) => i.barcode === p.barcode);
    return item ? { ...p, stock: Math.max(0, p.stock - item.qty) } : p;
  });
  for (const p of next) {
  const original = state.products.find((prod) => prod.id === p.id);

  if (original && original.stock !== p.stock) {
    const { error } = await supabaseClient
      .from('produtos')
      .update({ stock: p.stock })
      .eq('id', p.id);

    if (error) {
      console.error('Erro ao atualizar estoque:', error);
      alert('Venda salva, mas houve erro ao atualizar o estoque: ' + error.message);
      return;
    }
  }
}

state.products = next;
  state.success = sale;
  state.cart = [];
  state.payment = null;
  state.receivedStr = '';
  render();
  focusById('barcode-input');
  setTimeout(() => { if (state.success && state.success.id === sale.id) { state.success = null; render(); } }, 3500);
}
function copyPixCode() {
  const total = computeTotal();
  if (!state.pixConfig || !state.pixConfig.key || total <= 0) return;
  const payload = buildPixPayload({ key: state.pixConfig.key, name: state.pixConfig.name, city: state.pixConfig.city, amount: total });
  navigator.clipboard?.writeText(payload).then(() => {
    state.copied = true; render();
    setTimeout(() => { state.copied = false; render(); }, 2000);
  });
}

// ---------------------------------------------------------------------------
function lastClosureDatetime() { return state.cashClosures.length ? state.cashClosures[0].datetime : null; }
function periodSales() {
  const since = lastClosureDatetime();
  return state.sales.filter((s) => !since || new Date(s.datetime) > new Date(since));
}
function periodWithdrawals() {
  const since = lastClosureDatetime();
  return state.withdrawals.filter((w) => !since || new Date(w.datetime) > new Date(since));
}
function periodTotals() {
  const sales = periodSales();
  const totals = { dinheiro: 0, cartao: 0, pix: 0 };
  sales.forEach((s) => (totals[s.payment] += s.total));
  const totalGeral = totals.dinheiro + totals.cartao + totals.pix;
  const retiradas = periodWithdrawals().reduce((s, w) => s + w.amount, 0);
  const expectedCash = totals.dinheiro - retiradas;
  return { salesCount: sales.length, totals, totalGeral, retiradas, expectedCash };
}
function submitWithdrawal() {
  const amountRaw = (document.getElementById('wd-amount') || {}).value || '';
  const reason = (document.getElementById('wd-reason') || {}).value || '';
  const amount = parseFloat(amountRaw.replace(',', '.'));
  if (isNaN(amount) || amount <= 0) { state.withdrawalError = 'Informe um valor válido.'; render(); return; }
  const w = { id: uid(), datetime: new Date().toISOString(), amount, reason: reason.trim(), operator: state.currentUser?.name || null };
  saveWithdrawals([w, ...state.withdrawals]);
  state.withdrawalSuccess = w;
  state.withdrawalError = '';
  render();
  setTimeout(() => { if (state.withdrawalSuccess && state.withdrawalSuccess.id === w.id) { state.withdrawalSuccess = null; render(); } }, 3000);
}
async function submitCashClosure() {
  const informedRaw = (document.getElementById('close-informed') || {}).value || '';
  const informedCash = parseFloat(informedRaw.replace(',', '.'));
  if (isNaN(informedCash) || informedCash < 0) { state.closureError = 'Informe o valor em dinheiro contado no caixa.'; render(); return; }
  const pt = periodTotals();
  const closure = {
    id: uid(),
    datetime: new Date().toISOString(),
    salesCount: pt.salesCount,
    totalDinheiro: pt.totals.dinheiro,
    totalCartao: pt.totals.cartao,
    totalPix: pt.totals.pix,
    totalGeral: pt.totalGeral,
    retiradas: pt.retiradas,
    expectedCash: pt.expectedCash,
    informedCash,
    difference: informedCash - pt.expectedCash,
    operator: state.currentUser?.name || null,
  };
  await saveCashClosures([closure, ...state.cashClosures]);
  state.closureError = '';
  state.lastClosureResult = closure;
  render();
}

      if (pass !== pass2) { state.userFormError = 'As senhas não coincidem.'; render(); return; }
    }

    if (state.currentUser && state.currentUser.id === state.editingUserId) state.currentUser = { ...state.currentUser, name, role };
  } else {
    if (pass.length < 4) { state.userFormError = 'A senha deve ter pelo menos 4 caracteres.'; render(); return; }

async function submitProductForm() {
  const barcode = (document.getElementById('pf-barcode') || {}).value?.trim() || '';
  const name = (document.getElementById('pf-name') || {}).value?.trim() || '';
  const priceRaw = (document.getElementById('pf-price') || {}).value || '';
  const stockRaw = (document.getElementById('pf-stock') || {}).value || '';
  const category = (document.getElementById('pf-category') || {}).value?.trim() || '';

  const price = parseFloat(priceRaw.replace(',', '.'));
  const stock = parseInt(stockRaw || '0', 10);

  if (!barcode || !name || isNaN(price) || price <= 0) {
    state.formError = 'Preencha código de barras, nome e um preço válido.';
    render();
    return;
  }

  const dup = state.products.find(
    (p) => p.barcode === barcode && p.id !== state.editingProductId
  );

  if (dup) {
    state.formError = 'Já existe um produto com esse código de barras.';
    render();
    return;
  }

  const produto = {
    barcode,
    name,
    price,
    stock: isNaN(stock) ? 0 : stock,
    category
  };

  try {
    if (state.editingProductId) {

      const { data, error } = await supabaseClient
        .from('produtos')
        .update(produto)
        .eq('id', state.editingProductId)
        .select()
        .single();

      if (error) throw error;

      state.products = state.products.map((p) =>
        p.id === state.editingProductId ? data : p
      );

    } else {

      const { data, error } = await supabaseClient
        .from('produtos')
        .insert([produto])
        .select()
        .single();

      if (error) throw error;

      state.products.push(data);
    }

    resetProductForm();

  } catch (error) {
    console.error('Erro ao salvar produto:', error);
    state.formError = 'Erro ao salvar produto no Supabase: ' + error.message;
    render();
  }
}

  const isAmbos = state.currentUser && state.currentUser.role === 'ambos';
  const areaSwitchBtn = isAmbos
    ? (state.area === 'caixa'
        ? `<button class="btn" data-action="go-financeiro">${icon('lock', 13)} Ir para Financeiro</button>`
        : `<button class="btn" data-action="go-caixa">${icon('cart', 13)} Ir para Caixa</button>`)
    : '';
  const logoutBtn = `<button class="btn no-print" data-action="logout" style="border-color:transparent;background:none;">Sair</button>`;
  const kebabBtn = `<button class="menu-btn no-print" data-action="toggle-nav-menu" title="Menu">${dotsIcon(19)}</button>`;
 
  const rightBlock = `<div class="no-print" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        ${kebabBtn}
        ${areaSwitchBtn}
        ${logoutBtn}
      </div>`;
 
  const barItems = state.area === 'caixa' ? caixaTabs : financeiroTabs;
  const barActionName = state.area === 'caixa' ? 'set-caixa-tab' : 'set-tab';
  const barActiveId = state.area === 'caixa' ? state.caixaTab : state.tab;
  const menuBar = state.navMenuOpen
    ? `<div class="menu-bar no-print">${barItems.map(t => `<button data-action="${barActionName}" data-tab="${t.id}" class="${barActiveId === t.id ? 'active' : ''}">${icon(t.icon, 14)} ${t.label}</button>`).join('')}</div>`
    : '';
 
  return `
  <header class="header no-print">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-icon"><img src="${LOGO_SRC}" alt="Peachmart" /></div>
        ${nameBlock}
        <span class="badge ${state.area}">${state.area === 'caixa' ? 'Caixa' : 'Financeiro'}${state.currentUser ? ' · ' + escapeHtml(state.currentUser.name) : ''}</span>
      </div>
      ${rightBlock}
    </div>
    ${menuBar}
  </header>`;
}
 
function caixaVendaHTML() {
  const total = computeTotal();
  const pixReady = !!(state.pixConfig && state.pixConfig.key);
  const search = state.catalogSearch;
  const quick = search
    ? state.products.filter(p => p.name.toLowerCase().includes(search.toLowerCase()) || p.barcode.includes(search)).slice(0, 8)
    : state.products.slice(0, 8);
 
  const catalogHTML = state.products.length === 0
    ? `<p class="empty">Nenhum produto cadastrado ainda. Peça para o financeiro cadastrar os produtos.</p>`
    : quick.length === 0
      ? `<p class="empty">Nada encontrado para "${escapeHtml(search)}".</p>`
      : `<div class="catalog-grid">${quick.map(p => `
          <button class="prod-btn" data-action="add-to-cart" data-barcode="${escapeHtml(p.barcode)}" ${p.stock <= 0 ? 'disabled' : ''}>
            <div class="pname">${escapeHtml(p.name)}</div>
            <div class="pprice mono">${brl(p.price)}</div>
            <div class="pstock" style="color:${p.stock <= 5 ? 'var(--danger)' : 'var(--ink-soft)'}">${p.stock <= 0 ? 'sem estoque' : p.stock + ' em estoque'}</div>
          </button>`).join('')}</div>`;
 
  const cartHTML = state.cart.length === 0
    ? `<p class="empty">Carrinho vazio. Bipe ou digite o código de barras — é adicionado automaticamente ao apertar Enter.</p>`
    : state.cart.map((item, idx) => `
        <div>
          <div class="cart-item">
            <div style="min-width:0;">
              <div class="ci-name">${escapeHtml(item.name)}</div>
              <div class="ci-unit mono">${brl(item.price)} un.</div>
            </div>
            <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
              <button class="qty-btn" data-action="change-qty" data-barcode="${escapeHtml(item.barcode)}" data-delta="-1">${icon('minus', 11)}</button>
              <span class="mono" style="width:20px;text-align:center;font-size:13px;">${item.qty}</span>
              <button class="qty-btn" data-action="change-qty" data-barcode="${escapeHtml(item.barcode)}" data-delta="1">${icon('plus', 11)}</button>
              <span class="mono" style="width:64px;text-align:right;font-size:13px;">${brl(item.price * item.qty)}</span>
              <button class="icon-btn" data-action="remove-item" data-barcode="${escapeHtml(item.barcode)}" style="color:var(--danger);">${icon('trash', 14)}</button>
            </div>
          </div>
          ${idx < state.cart.length - 1 ? '<div class="dashed"></div>' : ''}
        </div>`).join('');
 
  let paymentExtra = '';
  if (state.payment === 'dinheiro') {
    const receivedNum = parseFloat((state.receivedStr || '0').replace(',', '.'));
    const troco = receivedNum - total;
    paymentExtra = `
      <div class="cash-box">
        <label class="field-label">Valor recebido</label>
        <input id="received-input" class="mono" style="width:100%;background:transparent;border:none;border-bottom:1px solid var(--line);outline:none;font-size:17px;padding-bottom:4px;" placeholder="0,00" value="${escapeHtml(state.receivedStr)}" />
        ${state.receivedStr ? `<div style="display:flex;justify-content:space-between;font-size:13px;margin-top:8px;">
          <span style="color:var(--ink-soft);">Troco</span>
          <span class="mono" style="font-weight:600;color:${troco >= 0 ? 'var(--primary-dark)' : 'var(--danger)'}">${troco >= 0 ? brl(troco) : 'valor insuficiente'}</span>
        </div>` : ''}
      </div>`;
  } else if (state.payment === 'pix') {
    if (!pixReady) {
      paymentExtra = `<div class="cash-box" style="color:var(--danger);display:flex;gap:8px;align-items:flex-start;">${icon('alert', 15)}<span>Chave Pix não cadastrada. Peça para o financeiro configurar em "Configurações".</span></div>`;
    } else {
      const payload = buildPixPayload({ key: state.pixConfig.key, name: state.pixConfig.name, city: state.pixConfig.city, amount: total });
      const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=8&data=${encodeURIComponent(payload)}`;
      paymentExtra = `
        <div class="pix-box" style="display:flex;flex-direction:column;align-items:center;gap:8px;">
          <img src="${qrUrl}" alt="QR Code Pix" width="180" height="180" />
          <p style="font-size:12px;text-align:center;color:var(--ink-soft);margin:0;">Peça para o cliente escanear o QR Code no app do banco.</p>
          <button class="btn" style="width:100%;justify-content:center;" data-action="copy-pix">${icon(state.copied ? 'check' : 'copy', 13)} ${state.copied ? 'Código copiado!' : 'Copiar código Pix'}</button>
        </div>`;
    }
  }
 
  const canFinalize = computeCanFinalize();
 
  return `
  <div class="grid5">
    <div class="col3 stack">
      <div class="card">
        <label class="field-label">Código de barras</label>
        <div class="input-wrap" style="margin-top:8px;">
          ${icon('scan', 17, 'var(--primary)')}
          <input id="barcode-input" data-enter="addByBarcode" value="${escapeHtml(state.code)}" placeholder="Bipe o código, ou digite 3*código para 3 unidades" autocomplete="off" />
        </div>
        <p style="font-size:12px;color:var(--ink-soft);margin:8px 0 0;">Para adicionar várias unidades de uma vez, digite a quantidade seguida de * e o código — por exemplo, 3*7891234567890. Ao apertar Enter (ou bipar), o item entra direto no carrinho.</p>
        ${state.notFound ? `<div class="error-text" style="display:flex;align-items:center;gap:6px;">${icon('alert', 14)} Código "${escapeHtml(state.notFound)}" não encontrado. Peça para o financeiro cadastrar esse produto.</div>` : ''}
      </div>
 
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
          <h2 style="font-size:14px;font-weight:600;margin:0;">Catálogo rápido</h2>
          <div class="input-wrap" style="padding:6px 10px;">
            ${icon('search', 13, 'var(--ink-soft)')}
            <input id="catalog-search" style="width:120px;font-size:12px;" placeholder="Buscar produto" value="${escapeHtml(state.catalogSearch)}" />
          </div>
        </div>
        ${catalogHTML}
      </div>
    </div>
 
    <div class="col2">
      <div class="card" style="position:sticky;top:96px;">
        <h2 style="font-size:14px;font-weight:600;margin:0 0 10px;display:flex;align-items:center;gap:6px;">${icon('cart', 15)} Venda atual</h2>
        ${cartHTML}
        <div class="cart-total"><span style="font-size:14px;font-weight:500;">Total</span><span class="val mono">${brl(total)}</span></div>
        ${state.cart.length > 0 ? `
          <div class="pay-grid">
            ${Object.entries(PAY).map(([key, p]) => `
              <button class="pay-btn ${state.payment === key ? 'active' : ''}" style="${state.payment === key ? `background:${p.hex};border-color:${p.hex};` : ''}" data-action="set-payment" data-payment="${key}">
                ${icon(p.icon, 16)} ${p.label}
              </button>`).join('')}
          </div>
          ${paymentExtra}
          <button class="finalize-btn" data-action="finalize-sale" ${canFinalize ? '' : 'disabled'} style="background:${canFinalize ? 'var(--primary)' : 'var(--line)'};cursor:${canFinalize ? 'pointer' : 'not-allowed'};">Finalizar venda</button>
        ` : ''}
        ${state.success ? `<div class="success-banner">${icon('check', 15)} Venda de ${brl(state.success.total)} registrada em ${PAY[state.success.payment].label}.</div>` : ''}
      </div>
    </div>
  </div>`;
}
 
function caixaHTML() {
  if (state.caixaTab === 'retirada') return caixaRetiradaHTML();
  if (state.caixaTab === 'fechar') return caixaFecharHTML();

function closureResultHTML(c) {
  const diffColor = c.difference === 0 ? 'var(--primary-dark)' : (c.difference > 0 ? 'var(--gold)' : 'var(--danger)');
  const diffLabel = c.difference === 0 ? 'Confere certinho' : (c.difference > 0 ? 'Sobra' : 'Falta');
  return `
  <div id="print-area" style="max-width:520px;" class="card">
    <h2 style="font-size:15px;font-weight:700;margin:0 0 2px;">Fechamento de caixa</h2>
    <p style="font-size:12px;color:var(--ink-soft);margin:0 0 14px;">${new Date(c.datetime).toLocaleString('pt-BR')}${c.operator ? ' · fechado por ' + escapeHtml(c.operator) : ''}</p>
    <div class="stack" style="gap:2px;">
      <div class="kv-row"><span>Vendas no turno</span><span class="mono">${c.salesCount}</span></div>
      <div class="kv-row"><span>Dinheiro (vendas)</span><span class="mono">${brl(c.totalDinheiro)}</span></div>
      <div class="kv-row"><span>Cartão (vendas)</span><span class="mono">${brl(c.totalCartao)}</span></div>
      <div class="kv-row"><span>Pix (vendas)</span><span class="mono">${brl(c.totalPix)}</span></div>
      <div class="kv-row total"><span>Total geral</span><span class="mono">${brl(c.totalGeral)}</span></div>
      <div class="kv-row" style="margin-top:8px;"><span>Retiradas</span><span class="mono">- ${brl(c.retiradas)}</span></div>
      <div class="kv-row"><span>Dinheiro esperado</span><span class="mono">${brl(c.expectedCash)}</span></div>
      <div class="kv-row"><span>Dinheiro contado</span><span class="mono">${brl(c.informedCash)}</span></div>
      <div class="kv-row total" style="color:${diffColor};"><span>${diffLabel}</span><span class="mono">${brl(Math.abs(c.difference))}</span></div>
    </div>
    <div class="no-print" style="display:flex;gap:8px;margin-top:18px;">
      <button class="btn" data-action="print-page">Imprimir</button>
      <button class="btn btn-primary" style="flex:1;justify-content:center;" data-action="conclude-closure">Concluir e voltar às vendas</button>
    </div>
  </div>`;
}

        <div class="card">
          <h3 style="font-size:13px;font-weight:600;margin:0 0 8px;color:var(--danger);display:flex;align-items:center;gap:6px;">${icon('alert', 14)} Estoque baixo</h3>
          ${lowStock.map(p => `<div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0;"><span>${escapeHtml(p.name)}</span><span class="mono" style="color:var(--danger);">${p.stock} un.</span></div>`).join('')}
        </div>` : ''}
    </div>
 
    <div class="col3">
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
          <h2 style="font-size:14px;font-weight:600;margin:0;">Produtos cadastrados (${state.products.length})</h2>
          <div class="input-wrap" style="padding:6px 10px;">
            ${icon('search', 13, 'var(--ink-soft)')}
            <input id="produtos-search" style="width:150px;font-size:12px;" placeholder="Buscar por nome ou código" value="${escapeHtml(state.produtosSearch)}" />
          </div>
        </div>
        ${state.products.length === 0
          ? `<p class="empty">Cadastre o primeiro produto usando o formulário ao lado.</p>`
          : filtered.length === 0
            ? `<p class="empty">Nada encontrado para "${escapeHtml(search)}".</p>`
            : filtered.map(p => `
              <div class="prod-row">
                <div style="min-width:0;">
                  <div style="font-size:13.5px;font-weight:500;">${escapeHtml(p.name)}</div>
                  <div class="mono" style="font-size:11.5px;color:var(--ink-soft);">${escapeHtml(p.barcode)}${p.category ? ' · ' + escapeHtml(p.category) : ''}</div>
                </div>
                <div style="display:flex;align-items:center;gap:14px;flex-shrink:0;">
                  <span class="mono" style="font-size:13px;">${brl(p.price)}</span>
                  <span class="mono" style="font-size:12px;width:56px;text-align:right;color:${p.stock <= 5 ? 'var(--danger)' : 'var(--ink-soft)'}">${p.stock} un.</span>
                  <button class="icon-btn" data-action="edit-product" data-id="${p.id}" style="color:var(--primary-dark);">${icon('pencil', 14)}</button>
                  <button class="icon-btn" data-action="remove-product" data-id="${p.id}" style="color:var(--danger);">${icon('trash', 14)}</button>
                </div>
              </div>`).join('')}
      </div>
    </div>
  </div>`;
}
 
function relatorioHTML() {
  const todaySales = state.sales.filter(s => new Date(s.datetime).toDateString() === todayStr());
  const totalToday = todaySales.reduce((s, v) => s + v.total, 0);
  const totalGeral = state.sales.reduce((s, v) => s + v.total, 0);
  const byMethodToday = { dinheiro: 0, cartao: 0, pix: 0 };
  todaySales.forEach(s => byMethodToday[s.payment] += s.total);
 
  const days = Array.from({ length: 7 }, (_, i) => { const d = new Date(); d.setDate(d.getDate() - (6 - i)); return d; });
  const dayTotals = days.map(d => ({ date: d, total: state.sales.filter(s => new Date(s.datetime).toDateString() === d.toDateString()).reduce((s, v) => s + v.total, 0) }));
  const maxDay = Math.max(1, ...dayTotals.map(d => d.total));
 
  return `
  <div class="stack">
    <div class="grid5">
      <div class="col2" style="grid-column:span 2;">
        <div class="stat-card" style="background:var(--primary);color:#fff;">
          <div class="lbl">Vendido hoje</div>
          <div class="val mono">${brl(totalToday)}</div>
          <div class="sub">${todaySales.length} venda(s)</div>
        </div>
      </div>
      <div class="col2" style="grid-column:span 2;">
        <div class="stat-card" style="background:var(--gold);">
          <div class="lbl">Total acumulado</div>
          <div class="val mono">${brl(totalGeral)}</div>
          <div class="sub">${state.sales.length} venda(s) no total</div>
        </div>
      </div>
      <div style="grid-column:span 1;">
        <div class="card" style="height:100%;">
          <p style="font-size:11px;font-weight:600;text-transform:uppercase;color:var(--ink-soft);margin:0 0 8px;">Hoje por pagamento</p>
          ${Object.entries(PAY).map(([key, p]) => `
            <div style="display:flex;justify-content:space-between;font-size:12.5px;padding:2px 0;">
              <span style="display:flex;align-items:center;gap:5px;"><span style="width:7px;height:7px;border-radius:99px;background:${p.hex};display:inline-block;"></span>${p.label}</span>
              <span class="mono">${brl(byMethodToday[key])}</span>
            </div>`).join('')}
        </div>
      </div>
    </div>
 
    <div class="card">
      <p style="font-size:11px;font-weight:600;text-transform:uppercase;color:var(--ink-soft);margin:0 0 16px;">Últimos 7 dias</p>
      <div class="bars">
        ${dayTotals.map(({ date, total }) => {
          const isToday = date.toDateString() === todayStr();
          const h = total > 0 ? Math.max(6, (total / maxDay) * 100) : 3;
          return `<div class="bar-col">
            <span class="mono" style="font-size:10px;color:var(--ink-soft);">${total > 0 ? brl(total).replace('R$', '').trim() : ''}</span>
            <div class="bar" style="height:${h}%;background:${isToday ? 'var(--gold)' : 'var(--primary)'};opacity:${isToday ? 1 : .75};"></div>
            <span style="font-size:10px;color:var(--ink-soft);">${date.toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', '')}</span>
          </div>`;
        }).join('')}
      </div>
    </div>
 
    <div class="card">
      <p style="font-size:11px;font-weight:600;text-transform:uppercase;color:var(--ink-soft);margin:0 0 8px;">Histórico de vendas</p>
      ${state.sales.length === 0 ? `<p class="empty">Nenhuma venda registrada ainda.</p>` : state.sales.slice(0, 40).map(s => {
        const p = PAY[s.payment];
        return `<div class="sale-row">
          <div style="min-width:0;">
            <div style="font-size:13px;font-weight:500;">${new Date(s.datetime).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}</div>
            <div style="font-size:11.5px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${s.items.length} item(ns) · ${s.items.map(i => escapeHtml(i.name)).join(', ')}${s.operator ? ' · ' + escapeHtml(s.operator) : ''}</div>
          </div>
          <div style="display:flex;align-items:center;gap:10px;flex-shrink:0;">
            <span class="pay-chip" style="background:${p.hex}1A;color:${p.hex};">${icon(p.icon, 11)} ${p.label}</span>
            <span class="mono" style="font-size:13px;width:76px;text-align:right;">${brl(s.total)}</span>
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}
 
function configHTML() {
  const cfg = state.pixConfig;
  const editingUser = state.editingUserId ? state.users.find(u => u.id === state.editingUserId) : null;
  return `
  <div style="max-width:620px;" class="stack">
    <div class="card">
      <h2 style="font-size:14px;font-weight:600;margin:0 0 2px;display:flex;align-items:center;gap:6px;">${icon('qr', 15, 'var(--pix)')} Chave Pix para recebimento</h2>
      <p style="font-size:12px;color:var(--ink-soft);margin:0 0 12px;">Usada para gerar o QR Code no caixa. Só quem acessa a área financeira pode ver ou alterar essa chave.</p>
      ${fieldHTML({ id: 'cfg-key', label: 'Chave Pix (CPF, CNPJ, e-mail, telefone ou aleatória)', value: cfg.key, placeholder: '00000000000', mono: true, enter: 'savePixConfig' })}
      <div class="row">
        ${fieldHTML({ id: 'cfg-name', label: 'Nome do recebedor', value: cfg.name, placeholder: 'Nome do titular', enter: 'savePixConfig' })}
        ${fieldHTML({ id: 'cfg-city', label: 'Cidade', value: cfg.city, placeholder: 'Sua cidade', enter: 'savePixConfig' })}
      </div>
      <button class="btn btn-primary" data-action="save-pix-config">Salvar chave Pix</button>
      ${state.configSaved ? `<span class="flash" style="color:var(--primary-dark);">${icon('check', 13)} Salvo</span>` : ''}
    </div>
 
    <div class="card">
      <h2 style="font-size:14px;font-weight:600;margin:0 0 2px;display:flex;align-items:center;gap:6px;">${icon('key', 15, 'var(--primary-dark)')} Usuários</h2>
      <p style="font-size:12px;color:var(--ink-soft);margin:0 0 12px;">Cada pessoa tem seu próprio usuário e senha. O papel decide o que ela pode acessar.</p>
 
      ${state.users.length > 0 ? `<div style="margin-bottom:16px;">
        ${state.users.map(u => `
          <div class="prod-row">
            <div>
              <div style="font-size:13.5px;font-weight:500;">${escapeHtml(u.name)}</div>
              <div style="font-size:11.5px;color:var(--ink-soft);">${u.role === 'caixa' ? 'Caixa' : (u.role === 'financeiro' ? 'Financeiro' : 'Caixa e Financeiro')}</div>
            </div>
            <div style="display:flex;align-items:center;gap:14px;">
              <button class="icon-btn" data-action="edit-user" data-id="${u.id}" style="color:var(--primary-dark);">${icon('pencil', 14)}</button>
              ${state.users.length > 1 ? `<button class="icon-btn" data-action="remove-user" data-id="${u.id}" style="color:var(--danger);">${icon('trash', 14)}</button>` : ''}
            </div>
          </div>`).join('')}
      </div>` : ''}
 
      <h3 style="font-size:13px;font-weight:600;margin:0 0 8px;">${editingUser ? 'Editar usuário' : 'Novo usuário'}</h3>
      ${fieldHTML({ id: 'uf-name', label: 'Nome', value: editingUser?.name || '', placeholder: 'Nome da pessoa', enter: 'submitUserForm' })}
      <div class="field">
        <label class="field-label">Papel</label>
        <div class="input-wrap">
          <select id="uf-role" style="width:100%;background:transparent;border:none;outline:none;font-size:14px;padding:2px 0;">
            <option value="caixa" ${editingUser?.role === 'caixa' ? 'selected' : ''}>Caixa</option>
            <option value="financeiro" ${editingUser?.role === 'financeiro' ? 'selected' : ''}>Financeiro</option>
            <option value="ambos" ${editingUser?.role === 'ambos' ? 'selected' : ''}>Caixa e Financeiro</option>
          </select>
        </div>
      </div>
      ${fieldHTML({ id: 'uf-pass', label: editingUser ? 'Nova senha (deixe em branco para manter)' : 'Senha', type: 'password', enter: 'submitUserForm' })}
      ${fieldHTML({ id: 'uf-pass2', label: 'Confirmar senha', type: 'password', enter: 'submitUserForm' })}
      ${state.userFormError ? `<p class="error-text">${escapeHtml(state.userFormError)}</p>` : ''}
      <div style="display:flex;gap:8px;">
        <button class="btn btn-primary" style="flex:1;justify-content:center;" data-action="submit-user-form">${editingUser ? 'Salvar alterações' : 'Criar usuário'}</button>
        ${editingUser ? `<button class="btn" data-action="reset-user-form">${icon('x', 15)}</button>` : ''}
      </div>
      ${state.userSaved ? `<span class="flash" style="color:var(--primary-dark);">${icon('check', 13)} Salvo</span>` : ''}
    </div>
  </div>`;
}
 
function buildHTML() {
  if (state.loading) {
    return `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;"><div style="display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-soft);">${icon('scan', 18)} Carregando o caixa…</div></div>`;
  }
  if (state.users.length === 0) {
    return `<main>${bootstrapHTML()}</main>`;
  }
  if (!state.currentUser) {
    return `<main>${loginHTML()}</main>`;
  }
  if (!state.area) {
    return `<main>${roleSelectHTML()}</main>`;
  }
  let mainContent = '';
  if (state.area === 'caixa') {
    mainContent = caixaHTML();
  } else if (state.area === 'financeiro') {
    if (state.tab === 'produtos') mainContent = produtosHTML();
    else if (state.tab === 'relatorio') mainContent = relatorioHTML();
    else if (state.tab === 'situacao') mainContent = caixaSituacaoHTML();
    else if (state.tab === 'config') mainContent = configHTML();
  }
  return `${headerHTML()}<main>${mainContent}</main>`;
}
 
// ---------------------------------------------------------------------------
// Eventos (delegação)
// ---------------------------------------------------------------------------
const ENTER_ACTIONS = {
  addByBarcode: () => addByBarcode(document.getElementById('barcode-input').value),
  saveName: () => {
    const val = (document.getElementById('name-input') || {}).value || '';
    saveStoreName(val.trim() || 'Peachmart');
    state.editingName = false;
    render();
  },
  submitProductForm: () => submitProductForm(),
  savePixConfig: () => savePixConfigHandler(),
  submitWithdrawal: () => submitWithdrawal(),
  submitCashClosure: () => submitCashClosure(),
  submitBootstrap: () => submitBootstrap(),
  submitLogin: () => submitLogin(),
  submitUserForm: () => submitUserForm(),
};
 
root.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-action]');
  if (!t) return;
  const action = t.dataset.action;
  if (action === 'toggle-edit-name') { state.editingName = true; render(); focusById('name-input'); }
  else if (action === 'toggle-nav-menu') { state.navMenuOpen = !state.navMenuOpen; render(); }
  else if (action === 'submit-bootstrap') submitBootstrap();
  else if (action === 'submit-login') submitLogin();
  else if (action === 'logout') logout();
  else if (action === 'choose-area') { state.area = t.dataset.area; if (state.area === 'caixa') state.caixaTab = 'venda'; else state.tab = 'produtos'; render(); }
  else if (action === 'go-financeiro') { state.area = 'financeiro'; state.tab = 'produtos'; state.navMenuOpen = false; render(); }
  else if (action === 'go-caixa') { state.area = 'caixa'; state.caixaTab = 'venda'; state.navMenuOpen = false; render(); }
  else if (action === 'set-caixa-tab') { state.caixaTab = t.dataset.tab; state.navMenuOpen = false; render(); }
  else if (action === 'set-tab') { state.tab = t.dataset.tab; state.navMenuOpen = false; render(); }
  else if (action === 'add-to-cart') { const p = state.products.find(pr => pr.barcode === t.dataset.barcode); addToCart(p, 1); render(); }
  else if (action === 'change-qty') { changeQty(t.dataset.barcode, parseInt(t.dataset.delta, 10)); render(); }
  else if (action === 'remove-item') { removeItem(t.dataset.barcode); render(); }
  else if (action === 'set-payment') { state.payment = t.dataset.payment; render(); }
  else if (action === 'finalize-sale') finalizeSale();
  else if (action === 'copy-pix') copyPixCode();
  else if (action === 'edit-product') editProduct(t.dataset.id);
  else if (action === 'remove-product') {await removeProductHandler(t.dataset.id);}
  else if (action === 'reset-product-form') resetProductForm();
  else if (action === 'submit-product-form') submitProductForm();
  else if (action === 'save-pix-config') savePixConfigHandler();
  else if (action === 'edit-user') editUser(t.dataset.id);
  else if (action === 'remove-user') removeUserHandler(t.dataset.id);
  else if (action === 'reset-user-form') resetUserForm();
  else if (action === 'submit-user-form') submitUserForm();
  else if (action === 'submit-withdrawal') submitWithdrawal();
  else if (action === 'submit-cash-closure') submitCashClosure();
  else if (action === 'conclude-closure') { state.lastClosureResult = null; state.caixaTab = 'venda'; render(); }
  else if (action === 'print-page') window.print();
});
 
root.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.enter) {
    e.preventDefault();
    const fn = ENTER_ACTIONS[e.target.dataset.enter];
    if (fn) fn();
  }
});
 
root.addEventListener('input', (e) => {
  const id = e.target.id;
  if (id === 'barcode-input') { state.code = e.target.value; }
  else if (id === 'catalog-search') { state.catalogSearch = e.target.value; render(); }
  else if (id === 'produtos-search') { state.produtosSearch = e.target.value; render(); }
  else if (id === 'received-input') { state.receivedStr = e.target.value; render(); }
});
 
root.addEventListener('blur', (e) => {
  if (e.target && e.target.id === 'name-input') {
    const val = e.target.value || '';
    saveStoreName(val.trim() || 'Peachmart');
    state.editingName = false;
    render();
  }
}, true);
 
// ----------------------------------supabase--------------------------------
loadData().then(() => {
  console.log('VENDAS CARREGADAS:', state.sales);
});
</script>
